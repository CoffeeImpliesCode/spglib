# SPDX-License-Identifier: BSD-3-Clause
#
# Fork-authored. `FORK-LICENSE.md` records the owner's authorization of that
# grant for this file and `COPYING` holds upstream's own BSD 3-Clause text.

name: Zig fork CI

# The only workflow in this repository, and it belongs to the downstream fork.
#
# Every step below is a command this package defines: a `zig build` step from
# `build.zig`, the `zig/consumer` run, or `tools/check_provenance.sh`. The
# upstream workflows that arrived with the import were removed rather than
# carried, because two of them publish this fork's builds to the upstream PyPI
# project and Codecov account; `CHANGELOG.md` entry 7 names them.
#
># What this workflow deliberately does not run: `-fsys=spglib`, because the
># runner has no installed spglib to link. The cross job compiles the six
># targets and executes none of them, because a cross-compiled binary cannot run
># on the runner.
#
># The delivery job installs both delivered variants into separate prefixes and
># compiles upstream's own C example against each one, so a change that breaks
># the shared library, the installed headers or the pkg-config metadata fails
># here rather than at a dependent.
#
# A green result here is a statement about this repository only. It says
# nothing about whether anything has been published to any remote.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  provenance:
    name: licence and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check licence, SPDX identifiers and pinned sources
        run: ./tools/check_provenance.sh

  native:
    name: build, test and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        run: zig build fmt-check
      # The default step is the install step, so it needs a prefix the way the
      # delivery job's installs below do. Without one it writes `zig-out` into
      # the checkout. The test, smoke, check and consumer steps install
      # nothing, so they carry no prefix.
      - name: Build and install
        run: zig build --prefix "$RUNNER_TEMP/spglib-default"
      - name: Tests in Debug
        run: zig build test -Doptimize=Debug
      - name: Tests in ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe
      - name: Smoke example
        run: zig build smoke
      - name: Compile-only analysis
        run: zig build check
      - name: Build steps available in this package
        run: zig build --list-steps

  cross:
    name: six-target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compiles the library, the whole public facade and the example for each
      # target. Nothing is executed: cross-compiled binaries cannot run here.
      - name: Compile the public surface for every supported target
        run: zig build check-targets

  consumer:
    name: downstream consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build and run the consumer on its own
        working-directory: zig/consumer
        run: zig build run
      - name: Build the consumer through the root step
        run: zig build consumer

  delivery:
    name: static and shared native delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Two separate prefixes, so neither install can satisfy a check that
      # belongs to the other. `-Dlinkage=static` is the package default and is
      # written out here so the two jobs cannot drift apart silently.
      - name: Install the static delivery
        run: zig build install -Dlinkage=static --prefix "$RUNNER_TEMP/spglib-static"
      - name: Install the shared delivery
        run: zig build install -Dlinkage=dynamic --prefix "$RUNNER_TEMP/spglib-shared"
      # The runtime-loaded route. `-Druntime` is orthogonal to `-Dlinkage`, so
      # it is built here under both linkages, and each prefix still receives
      # the same library, headers, pkg-config file and licence records: the
      # artifact is delivery, the dispatch is how the facade reaches it.
      - name: Install the runtime route, static delivery
        run: zig build install -Druntime=true -Dlinkage=static --prefix "$RUNNER_TEMP/spglib-runtime-static"
      - name: Install the runtime route, shared delivery
        run: zig build install -Druntime=true -Dlinkage=dynamic --prefix "$RUNNER_TEMP/spglib-runtime-shared"
      - name: The runtime route still delivers a complete install
        run: |
          set -eu
          static="$RUNNER_TEMP/spglib-runtime-static"
          shared="$RUNNER_TEMP/spglib-runtime-shared"
          test -f "$static/lib/libspglib.a"
          test -f "$shared/lib/libspglib.so"
          test -f "$shared/lib/pkgconfig/spglib.pc"
          test -f "$shared/share/licenses/spglib/COPYING"
          grep -q -- '-lspglib' "$static/lib/pkgconfig/spglib.pc"
          grep -q -- '-lspglib' "$shared/lib/pkgconfig/spglib.pc"
      # Compile-only. A loaded run needs a provider this runner does not have,
      # and naming a fake one would be exactly the fake fallback the build
      # contract forbids, so the executed loaded route is the driver's gate
      # against a real provider prefix, not this workflow's claim.
      - name: The runtime route compiles the public surface
        run: zig build check -Druntime=true
      - name: The runtime route compiles for every supported target
        run: zig build check-targets -Druntime=true
      - name: Installed layout and link metadata
        run: |
          set -eu
          static="$RUNNER_TEMP/spglib-static"
          shared="$RUNNER_TEMP/spglib-shared"
          test -f "$static/lib/libspglib.a"
          test -f "$static/include/spglib.h"
          test -f "$static/include/spglib/version.h"
          test -f "$static/lib/pkgconfig/spglib.pc"
          test -f "$shared/lib/libspglib.so"
          test -f "$shared/lib/libspglib.so.2"
          test -f "$shared/lib/pkgconfig/spglib.pc"
          # Each pkg-config file describes its own variant: the archive carries
          # the maths library and the static define, the shared object carries
          # neither.
          grep -q -- '-lspglib -lm' "$static/lib/pkgconfig/spglib.pc"
          grep -q -- 'Cflags: .*-DSPG_STATIC_LIBRARY' "$static/lib/pkgconfig/spglib.pc"
          grep -q -- 'Libs: -L${libdir} -lspglib$' "$shared/lib/pkgconfig/spglib.pc"
          grep -q -- 'Libs.private: -lm' "$shared/lib/pkgconfig/spglib.pc"
          ! grep -q -- 'SPG_STATIC_LIBRARY' "$shared/lib/pkgconfig/spglib.pc"
      - name: Both installs carry their licence and provenance records
        run: |
          set -eu
          for root in "$RUNNER_TEMP/spglib-static" "$RUNNER_TEMP/spglib-shared"; do
            for record in COPYING NOTICE.md FORK-LICENSE.md UPSTREAM.md; do
              test -f "$root/share/licenses/spglib/$record"
            done
          done
      # Upstream's own C example, compiled against each install through the
      # installed pkg-config file rather than against this repository's include
      # paths, so it exercises the delivered headers and the delivered metadata.
      # It is a real answer, not a link check: the program prints the
      # international symbol and the space-group number of a wurtzite cell.
      - name: Compile and run the installed C surface, static
        run: |
          set -eu
          prefix="$RUNNER_TEMP/spglib-static"
          zig cc example/c_api/example.c -o "$RUNNER_TEMP/example-static" \
            $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --cflags --libs spglib)
          "$RUNNER_TEMP/example-static"
      - name: Compile and run the installed C surface, shared
        run: |
          set -eu
          prefix="$RUNNER_TEMP/spglib-shared"
          zig cc example/c_api/example.c -o "$RUNNER_TEMP/example-shared" \
            -Wl,-rpath,"$prefix/lib" \
            $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --cflags --libs spglib)
          "$RUNNER_TEMP/example-shared"